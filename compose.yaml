# Lancement : docker compose run --rm audit            (affichage texte)
#             docker compose run --rm audit -f json -n 10   (arguments surchargés : repréciser -r /host)
services:
  audit:
    build: .
    image: audit-sys:latest

    # --- Namespaces partagés avec l'hôte ---------------------------------
    pid: host
    network_mode: host
    # --- Droits --------------------------
    # ss -p lit /proc/<pid>/fd des processus d'autres utilisateurs : il faut
    # SYS_PTRACE en plus des capacités par défaut de Docker.
    cap_add:
      - SYS_PTRACE
    security_opt:
      # Le profil AppArmor docker-default interdit de "ptracer" des processus
      # non confinés de l'hôte.
      - apparmor=unconfined
      # Interdit toute élévation de privilèges dans le conteneur.
      - no-new-privileges:true

    # Système de fichiers du conteneur en lecture seule (rien à y écrire)
    read_only: true
    tmpfs:
      - /tmp

    # --- Montages ---------------------------------------------------------
    volumes:
      - /:/host:ro
      - /run/systemd:/run/systemd:ro
      - ./out:/out

    environment:
      # Avec pid: host, systemctl croit être dans un chroot (la racine de
      # /proc/1/root diffère de la sienne) et refuse de parler à systemd.
      SYSTEMD_IGNORE_CHROOT: "1"

    # Arguments passés à ENTRYPOINT (ruby /app/audit.rb)
    command: ["--racine", "/host", "--format", "texte"]
